<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Frontline Simulator v7</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#101722;color:#f4f6fa}#app{height:100%;display:flex;flex-direction:column}
header{padding:10px 12px;background:#182334;display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:17px;margin:0}.sub{font-size:11px;color:#aab7c8;margin-top:3px}
#map{flex:1;min-height:230px;background:#263444}.panel{background:#182334;padding:9px;display:grid;gap:8px}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
button,select{background:#293b52;color:white;border:1px solid #52677f;border-radius:8px;padding:9px 10px;font-size:13px}button.active{outline:2px solid white}.small{font-size:11px;color:#aab7c8}.stats{display:flex;justify-content:space-between;font-size:12px}#status{font-size:12px;color:#cbd6e4}.legend{display:flex;gap:10px;font-size:11px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
</style></head><body><div id="app"><header><div><h1>Frontline Simulator <span style="color:#8fc5ff">v7</span></h1><div class="sub">2D real-time battle map</div></div><div class="legend"><span><i class="dot" style="background:#df4545"></i>Red</span><span><i class="dot" style="background:#397fe0"></i>Blue</span><span> - - - Front</span></div></header>
<div id="map"></div><div class="panel"><div class="controls"><select id="attacker"><option value="">Red country…</option></select><select id="defender"><option value="">Blue country…</option></select><button id="start">Start war</button><button id="pause">Pause</button><button id="reset">Reset</button><select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></div>
<div class="controls"><button data-unit="infantry" class="active">♟ Infantry</button><button data-unit="tank">▣ Tank</button><button data-unit="missile">➤ Missile</button><button data-unit="fpv">✦ FPV</button><span class="small">Choose a force, then tap the map to deploy.</span></div><div class="stats"><span id="redCount">Red forces: 0</span><span id="blueCount">Blue forces: 0</span></div><div id="status">Select two countries, start the war, then deploy forces.</div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([30,15],2);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri'}).addTo(map);
const borders=L.geoJSON(null,{style:{color:'#e9eef5',weight:1,fillOpacity:0}}).addTo(map);let countryLayers={};const $=id=>document.getElementById(id);
fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson').then(r=>r.json()).then(g=>{borders.addData(g);g.features.forEach(f=>{let n=f.properties.ADMIN||f.properties.name;if(n)countryLayers[n]=f});Object.keys(countryLayers).sort().forEach(n=>['attacker','defender'].forEach(id=>{let o=document.createElement('option');o.value=n;o.textContent=n;$(id).appendChild(o)}));$('status').textContent='Country borders loaded. Choose the red and blue countries.'}).catch(()=>$('status').textContent='Could not load country borders. Check your internet connection.');
let selected='infantry',war=false,paused=false,last=0,units=[],frontPts=[],frontLine=null,redArea=null,blueArea=null,contested=null,centers=null,raf=0;
document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{selected=b.dataset.unit;document.querySelectorAll('[data-unit]').forEach(x=>x.classList.toggle('active',x===b))});
function centerOf(n){let f=countryLayers[n];return f?L.geoJSON(f).getBounds().getCenter():null}function lerp(a,b,t){return L.latLng(a.lat+(b.lat-a.lat)*t,a.lng+(b.lng-a.lng)*t)}
function makeFront(a,b){frontPts=[];for(let i=0;i<=24;i++)frontPts.push(lerp(a,b,i/24));[frontLine,redArea,blueArea,contested].forEach(x=>x&&map.removeLayer(x));frontLine=L.polyline(frontPts,{color:'white',weight:3,dashArray:'8 9'}).addTo(map);updateTerritory()}
function updateTerritory(){if(!centers)return;let rp=[centers.red,...frontPts],bp=[...frontPts.slice().reverse(),centers.blue];if(redArea)redArea.setLatLngs(rp);else redArea=L.polygon(rp,{stroke:false,fillColor:'#df4545',fillOpacity:.23,interactive:false}).addTo(map);if(blueArea)blueArea.setLatLngs(bp);else blueArea=L.polygon(bp,{stroke:false,fillColor:'#397fe0',fillOpacity:.23,interactive:false}).addTo(map);let rib=frontPts.map((p,i)=>L.latLng(p.lat+(i%2?.07:-.07),p.lng)),poly=[...frontPts,...rib.reverse()];if(contested)contested.setLatLngs(poly);else contested=L.polygon(poly,{stroke:false,fillColor:'#e9edf5',fillOpacity:.1,interactive:false}).addTo(map)}
function counts(){$('redCount').textContent='Red forces: '+units.filter(u=>u.team==='red').length;$('blueCount').textContent='Blue forces: '+units.filter(u=>u.team==='blue').length}
function clearUnits(){units.forEach(u=>map.removeLayer(u.marker));units=[];counts()}
function addUnit(ll,team,type){let c={infantry:{hp:100,damage:1,icon:'♟'},tank:{hp:500,damage:5,icon:'▣'},missile:{hp:1,damage:10,icon:'➤'},fpv:{hp:1,damage:10,icon:'✦'}}[type],color=team==='red'?'#df4545':'#397fe0';let marker=L.marker(ll,{icon:L.divIcon({className:'',html:`<div style="background:${color};border:2px solid white;border-radius:50%;width:31px;height:31px;display:grid;place-items:center;color:white;font-size:17px;box-shadow:0 2px 5px #000">${c.icon}</div>`,iconSize:[31,31],iconAnchor:[15,15]})}).addTo(map);units.push({team,type,hp:c.hp,damage:c.damage,marker,ll:L.latLng(ll.lat,ll.lng)});counts()}
function startWar(){let an=$('attacker').value,bn=$('defender').value;if(!an||!bn||an===bn){$('status').textContent='Choose two different countries first.';return}let a=centerOf(an),b=centerOf(bn);if(!a||!b){$('status').textContent='Could not find a country center.';return}centers={red:a,blue:b};makeFront(a,b);map.fitBounds(L.latLngBounds(a,b).pad(.25));clearUnits();war=true;paused=false;last=0;$('status').textContent='War started. Tap either side of the dashed line to deploy forces.';cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
$('start').onclick=startWar;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';if(!paused){last=0;raf=requestAnimationFrame(loop)}};
$('reset').onclick=()=>{war=false;paused=true;cancelAnimationFrame(raf);clearUnits();[frontLine,redArea,blueArea,contested].forEach(x=>x&&map.removeLayer(x));frontLine=redArea=blueArea=contested=null;frontPts=[];$('status').textContent='Battle reset.'};
map.on('click',e=>{if(!war)return;addUnit(e.latlng,e.latlng.distanceTo(centers.red)<e.latlng.distanceTo(centers.blue)?'red':'blue',selected)});
function loop(ts){if(!war||paused)return;let dt=last?Math.min((ts-last)/1000,.08):0;last=ts;dt*=Number($('speed').value);
frontPts=frontPts.map((p,i)=>{let push=0;units.forEach(u=>{let d=map.distance(p,u.ll);if(d<180000)push+=(u.team==='red'?1:-1)*(1-d/180000)*(u.type==='tank'?1.5:1)});let smooth=i>0&&i<frontPts.length-1?(frontPts[i-1].lat+frontPts[i+1].lat)/2-p.lat:0;return L.latLng(p.lat+push*dt*.012+smooth*.035,p.lng)});
units.forEach(u=>{let target=null,best=Infinity;units.forEach(v=>{if(v.team!==u.team){let d=map.distance(u.ll,v.ll);if(d<best){best=d;target=v.ll}}});if(!target)frontPts.forEach(p=>{let d=map.distance(u.ll,p);if(d<best){best=d;target=p}});if(target&&best>3500){let step=Math.min(best,70000*dt);u.ll=lerp(u.ll,target,best?step/best:0);u.marker.setLatLng(u.ll)}});
units.forEach(u=>{let enemy=units.find(v=>v.team!==u.team&&map.distance(v.ll,u.ll)<42000);if(enemy){enemy.hp-=u.damage*dt*2;if((u.type==='missile'||u.type==='fpv')&&enemy.hp>0)u.hp=0}});
units=units.filter(u=>{if(u.hp<=0){map.removeLayer(u.marker);return false}return true});counts();updateTerritory();frontLine.setLatLngs(frontPts);raf=requestAnimationFrame(loop)}
</script></body></html>
