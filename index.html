<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Frontline Simulator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
#map{height:100%;width:100%}
.panel{position:absolute;z-index:1000;top:10px;left:10px;right:10px;background:#171b22ed;padding:10px;border-radius:12px;max-width:520px;box-shadow:0 3px 16px #0008}
.row{display:flex;gap:7px;align-items:center;margin:5px 0;flex-wrap:wrap}
select,button{background:#2b3340;color:white;border:1px solid #596579;border-radius:7px;padding:9px;font-size:14px}
button{font-weight:bold}button:disabled{opacity:.45}
.red{color:#ff7777}.blue{color:#79baff}.small{font-size:12px;color:#c5ccd6}
#status{font-size:12px;color:#d6dde8;margin-top:4px}
.unit{border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:white;font-size:17px;font-weight:bold;border:2px solid white;box-shadow:0 1px 5px #000}
.unit.red{background:#c92727}.unit.blue{background:#1769c2}
.hp{position:absolute;top:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#111d;color:#fff;border-radius:4px;padding:1px 3px;font-size:10px;border:1px solid #ffffff80}
.leaflet-tooltip{background:#151a22;color:white;border:1px solid #697487}
@media(max-width:520px){.panel{font-size:13px}.panel select{max-width:130px}button,select{padding:8px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
 <div class="row"><b>FRONTLINE SIMULATOR</b><span class="small">2D real-time prototype</span></div>
 <div class="row"><label class="small">Attacker</label><select id="attacker"></select><label class="small">Defender</label><select id="defender"></select></div>
 <div class="row"><button id="redSide">Place RED</button><button id="blueSide">Place BLUE</button>
 <select id="kind"><option value="infantry">Infantry · 100 HP · 1 DMG</option><option value="tank">Tank · 500 HP · 5 DMG</option><option value="missile">Missile · 10 DMG</option><option value="fpv">FPV · 10 DMG</option></select></div>
 <div class="row"><button id="start">START WAR</button><button id="pause" disabled>PAUSE</button><button id="reset">RESET</button></div>
 <div id="status">Choose two countries, place forces on the map, then start the war. Tap a country to select it.</div>
 <div class="small">Red advances into blue as light red; blue advances into red as light blue. Units move toward enemies and fight when close.</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{worldCopyJump:true}).setView([30,20],2);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Tiles © Esri'}).addTo(map);
const $=id=>document.getElementById(id);
let countries=[], countryLayer=null, selectedA=null,selectedD=null, placing='red', units=[], running=false,last=0,raf=0;
const defs={infantry:{hp:100,damage:1,glyph:'♟',speed:0.00022},tank:{hp:500,damage:5,glyph:'▰',speed:0.00014},missile:{hp:null,damage:10,glyph:'➤',speed:0.00035},fpv:{hp:null,damage:10,glyph:'✦',speed:0.0004}};
function say(s){$('status').textContent=s}
function normName(p){return p.ADMIN||p.name||p.NAME||p.name_long||'Country'}
function fillSelects(){
 const names=countries.map(f=>normName(f.properties)).sort();
 for(const id of ['attacker','defender']){$(id).innerHTML='';names.forEach(n=>{let o=document.createElement('option');o.value=o.textContent=n;$(id).appendChild(o)})}
 $('attacker').value='Ukraine';$('defender').value='Russia';
 if(!$('attacker').value) $('attacker').selectedIndex=0;
 if(!$('defender').value) $('defender').selectedIndex=Math.min(1,names.length-1);
 syncCountries();
}
function getFeature(name){return countries.find(f=>normName(f.properties)===name)}
function syncCountries(){
 selectedA=$('attacker').value;selectedD=$('defender').value;
 if(countryLayer)countryLayer.remove();
 countryLayer=L.geoJSON(countries,{style:f=>{let n=normName(f.properties);return {color:'#e8edf4',weight:.7,fillColor:n===selectedA?'#d92727':n===selectedD?'#1769c2':'#111',fillOpacity:n===selectedA||n===selectedD?.38:.015}} ,onEachFeature:(f,l)=>l.on('click',()=>{let n=normName(f.properties);if(n===selectedA||n===selectedD)return;if(!$('attacker').dataset.touched){$('attacker').value=n;$('attacker').dataset.touched='1'}else{$('defender').value=n;$('attacker').dataset.touched=''}syncCountries()})}).addTo(map);
}
$('attacker').onchange=syncCountries;$('defender').onchange=syncCountries;
$('redSide').onclick=()=>{placing='red';say('Tap the map to place RED forces.')};
$('blueSide').onclick=()=>{placing='blue';say('Tap the map to place BLUE forces.')};
map.on('click',e=>{if(running)return;addUnit(placing,$('kind').value,e.latlng.lat,e.latlng.lng)});
function addUnit(side,type,lat,lng){
 const d=defs[type],el=document.createElement('div');el.className='unit '+side;el.innerHTML=(d.hp===null?'<span class="hp">10 DMG</span>':'<span class="hp">'+d.hp+' HP</span>')+d.glyph;
 const icon=L.divIcon({className:'',html:el,iconSize:[30,30],iconAnchor:[15,15]});
 let marker=L.marker([lat,lng],{icon}).addTo(map);
 units.push({side,type,hp:d.hp,lat,lng,marker,used:false,alive:true});
}
function nearestEnemy(u){let best=null,dist=Infinity;for(const v of units){if(!v.alive||v.side===u.side)continue;let d=Math.hypot(v.lat-u.lat,v.lng-u.lng);if(d<dist){dist=d;best=v}}return {unit:best,dist}}
function updateIcon(u){let el=u.marker.getElement();if(!el)return;let hp=el.querySelector('.hp');if(hp&&u.hp!==null)hp.textContent=Math.max(0,Math.ceil(u.hp))+' HP'}
let contested=[];
function clearContested(){contested.forEach(x=>x.remove());contested=[]}
function renderContested(){
 clearContested();
 units.filter(u=>u.alive&&(u.type==='infantry'||u.type==='tank')).forEach(u=>{
  let c=L.circle([u.lat,u.lng],{radius:u.type==='tank'?9000:5500,color:u.side==='red'?'#ff7777':'#74c8ff',weight:1,fillColor:u.side==='red'?'#ff7777':'#74c8ff',fillOpacity:.19,dashArray:'4 5',interactive:false}).addTo(map);contested.push(c);
 });
}
function tick(t){
 if(!running)return;
 const dt=Math.min((t-last)/16.67||1,3);last=t;
 for(const u of units){
  if(!u.alive)continue;
  const d=defs[u.type],near=nearestEnemy(u),v=near.unit;
  if(!v){continue}
  const range=u.type==='missile'||u.type==='fpv'?.16:.055;
  if(near.dist>range){
   const step=d.speed*dt,dist=near.dist||1;
   u.lat+=(v.lat-u.lat)/dist*step;u.lng+=(v.lng-u.lng)/dist*step;
   u.marker.setLatLng([u.lat,u.lng]);
  }else if(u.type==='missile'||u.type==='fpv'){
   v.hp-=d.damage;u.alive=false;map.removeLayer(u.marker);updateIcon(v);
   if(v.hp!==null&&v.hp<=0){v.alive=false;map.removeLayer(v.marker)}
  }else{
   v.hp-=d.damage;updateIcon(v);
   if(v.hp!==null&&v.hp<=0){v.alive=false;map.removeLayer(v.marker)}
  }
 }
 renderContested();
 if(units.filter(u=>u.alive&&u.hp!==null).length===0){running=false;$('pause').disabled=true;say('War ended: no surviving infantry or tanks.');return}
 raf=requestAnimationFrame(tick);
}
$('start').onclick=()=>{if(running)return;running=true;last=0;$('pause').disabled=false;$('pause').textContent='PAUSE';say('War is active. Forces are moving toward the nearest enemy.');raf=requestAnimationFrame(tick)};
$('pause').onclick=()=>{running=!running;if(running){last=0;$('pause').textContent='PAUSE';raf=requestAnimationFrame(tick)}else{$('pause').textContent='RESUME';cancelAnimationFrame(raf)}};
$('reset').onclick=()=>{running=false;cancelAnimationFrame(raf);units.forEach(u=>map.removeLayer(u.marker));units=[];clearContested();$('pause').disabled=true;$('pause').textContent='PAUSE';say('Reset. Place forces on the map.');};
fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson').then(r=>r.json()).then(g=>{countries=g.features;fillSelects();say('Map ready. Choose countries and place forces.')}).catch(()=>say('Could not load country borders. Check your internet connection.'));
</script>
</body></html>
